name: PROBE4 gitea-contexts
# Isolate: the gitea.* contexts alone, no secret reference.
on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: contexts
        env:
          GITEA_SERVER: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
        run: |
          echo "server=$GITEA_SERVER repo=$GITEA_REPOSITORY"
