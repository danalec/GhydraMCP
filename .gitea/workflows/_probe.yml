name: PROBE release shape
# TEMPORARY diagnostic. Mirrors the shape of release.yml (workflow_dispatch
# with inputs, the gitea.* contexts, a secrets.RELEASE_TOKEN reference, quoted
# step names) but triggers on a branch push instead of a tag push.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (e.g. 3.1.0)'
        required: true
        type: string

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Resolve the release version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Guard: version constants must match the release version"
        run: python3 scripts/version.py --check --expect 3.0.0

      - name: Create the release
        env:
          TEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITEA_SERVER: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          echo "server=$GITEA_SERVER repo=$GITEA_REPOSITORY"
          echo "token_length=${#TEA_TOKEN}"
          tea --version
