name: PROBE6 github-contexts
# Isolate: the GitHub-compatible github.* contexts as the replacement for
# the gitea.* ones.
on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: contexts
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "server=$SERVER_URL repo=$REPOSITORY"
